    $("status").textContent = paused ? "\u5DF2\u6682\u505C" : snap.reason || (phase() === "rolling" ? "\u770B\u8FDE\u9501\u78B0\u649E\u2026\u2026" : "\u4ECE\u53D1\u5149\u732B\u722A\u5411\u7269\u54C1\u65B9\u5411\u62D6\uFF0C\u677E\u624B\u62CD\uFF01");
